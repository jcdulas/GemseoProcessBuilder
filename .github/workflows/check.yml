name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.12 is the minimum and reference version; GEMSEO 6 supports up to 3.13.
        python: ["3.12", "3.13"]
    env:
      # Qt draws nothing on screen during the tests.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
          libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check
        shell: bash
        run: python tools/check.py 2>&1 | tee check.log; exit "${PIPESTATUS[0]}"
      - name: Report the failures
        if: failure()
        shell: bash
        # Annotations are readable without signing in, unlike the job logs.
        run: |
          # A test over the time limit stops pytest: its stack names it.
          grep -E "^(FAIL|FAILED|ERROR) |Timeout|error:|^not ok|File .*tests.python.*test_" check.log | head -40 |
            while IFS= read -r line; do echo "::error::${line}"; done

  package:
    name: Installed package, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a fresh environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/gpb"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$RUNNER_TEMP/gpb/Scripts"; else bin="$RUNNER_TEMP/gpb/bin"; fi
          "$bin/python" -m pip install dist/*.whl
          echo "GPB_PYTHON=$bin/python" >> "$GITHUB_ENV"
      - name: Run every example with the installed package
        shell: bash
        # From outside the repository, so that the installed package is used.
        run: |
          cd "$RUNNER_TEMP"
          "$GPB_PYTHON" -m gemseo_process_builder --version
          "$GPB_PYTHON" "$GITHUB_WORKSPACE/tools/smoke_installed.py" 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          exit "${PIPESTATUS[0]}"
      - name: Report the failures
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAIL|ok) |Error|Traceback" "$RUNNER_TEMP/smoke.log" | head -40 |
            while IFS= read -r line; do echo "::error::${line}"; done
